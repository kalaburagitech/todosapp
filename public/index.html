<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Notespace | Notes & To-Dos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div><p class="eyebrow">YOUR QUIET CORNER</p><h1>Notespace<span>.</span></h1></div>
        <button class="primary-button" id="new-note-button" type="button"><span>+</span> New note</button>
      </header>
      <section class="toolbar" aria-label="Note controls">
        <label class="search-box"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="Search notes..." /></label>
        <label class="sort-box">Sort <select id="sort-select"><option value="newest">Newest date</option><option value="oldest">Oldest date</option></select></label>
      </section>
      <p class="note-count" id="note-count" aria-live="polite"></p>
      <section id="notes-list" class="notes-grid" aria-live="polite"></section>
    </main>

    <dialog id="note-dialog" class="dialog"><form id="note-form" novalidate>
      <div class="dialog-header"><div><p class="eyebrow">CAPTURE A THOUGHT</p><h2 id="form-title">New note</h2></div><button class="icon-button" id="close-dialog" type="button" aria-label="Close">×</button></div>
      <input id="note-id" type="hidden" />
      <label>Heading <input id="heading" name="heading" required maxlength="100" placeholder="What is on your mind?" /><small id="heading-error"></small></label>
      <label>Description <textarea id="description" name="description" required maxlength="2000" placeholder="Write it down..." rows="5"></textarea><small id="description-error"></small></label>
      <div class="field-row"><label>Date <input id="date" name="date" type="date" required /><small id="date-error"></small></label><label>Time <input id="time" name="time" type="text" required placeholder="10:30 AM" /><small id="time-error"></small></label></div>
      <p id="form-message" class="form-message" aria-live="polite"></p>
      <div class="form-actions"><button id="cancel-button" type="button" class="secondary-button">Cancel</button><button id="save-button" type="submit" class="primary-button">Save note</button></div>
    </form></dialog>

    <dialog id="delete-dialog" class="dialog confirmation"><div><p class="eyebrow">DELETE NOTE</p><h2>Delete this note?</h2><p>This note will be hidden from your list, but remains safely stored in your notes file.</p><div class="form-actions"><button id="keep-button" class="secondary-button" type="button">Keep it</button><button id="confirm-delete-button" class="danger-button" type="button">Delete note</button></div></div></dialog>
    <template id="note-template"><article class="note-card"><div class="card-top"><p class="note-date"></p><div class="card-actions"><button class="edit-button" type="button">Edit</button><button class="delete-button" type="button" aria-label="Delete note">⌫</button></div></div><h2 class="note-heading"></h2><p class="note-description"></p><footer><span class="note-time"></span><span class="timestamps"></span></footer></article></template>
    <script src="app.js"></script>
  </body>
</html>
